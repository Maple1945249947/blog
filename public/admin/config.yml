backend:
  name: github
  repo: "Maple1945249947/blog"
  branch: main

site_url: "https://blog-6v2.pages.dev"
display_url: "https://blog-6v2.pages.dev"

media_folder: "public/images/uploads"
public_folder: "/images/uploads"

collections:
  - name: "pages"
    label: "Pages"
    folder: "src/pages"
    create: true
    slug: "{{slug}}"
    extension: "md"
    format: "frontmatter"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Body", name: "body", widget: "markdown" }
